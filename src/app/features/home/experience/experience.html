<section class="experience" id="experience">
  <div class="container">
    <app-section-title
      [label]="i18n.t().experience.label"
      [heading]="i18n.t().experience.heading"
      [subheading]="i18n.t().experience.subheading"
    />

    <div class="experience__timeline">
      @for (exp of experiences(); track exp.company) {
        <div class="experience__item">
          <div class="experience__indicator">
            <div class="experience__dot" [class.current]="exp.current"></div>
            <div class="experience__connector"></div>
          </div>

          <div class="experience__content card">
            <div class="experience__header">
              <div class="experience__header-left">
                <h3 class="experience__company">{{ exp.company }}</h3>
                <p class="experience__role">{{ exp.role }}</p>
              </div>
              <div class="experience__header-right">
                <span class="experience__period" [class.current]="exp.current">{{ exp.period }}</span>
                <span class="experience__location">{{ exp.location }}</span>
              </div>
            </div>

            <ul class="experience__highlights">
              @for (hl of exp.highlights; track hl) {
                <li class="experience__highlight">{{ hl }}</li>
              }
            </ul>

            <div class="experience__stack">
              @for (tech of exp.stack; track tech) {
                <span class="badge badge-cyan">{{ tech }}</span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
